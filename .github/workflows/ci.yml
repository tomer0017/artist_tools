# Continuous integration: every push and pull request is type-checked,
# linted and tested (unit/integration with an in-memory MongoDB, then the
# end-to-end suite in Chromium and WebKit against a production build).
#
# It never deploys and uses no secrets: releases stay a deliberate step on the
# server (deploy/release.sh). Actions are pinned to full commit SHAs.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, lint, unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npm run lint
      - name: Cache the MongoDB binary used by the integration tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Unit and integration tests
        run: npx vitest run
      - name: Dependency audit (report only; known findings in docs/security/dependency-audit.md)
        run: npm audit --omit=dev --audit-level=high || true

  e2e:
    name: End-to-end tests (Chromium, WebKit iPhone emulation)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache the MongoDB binary used by the test server
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the browsers
        # Usually about a minute; a stalled package mirror is retried instead
        # of holding the job until its timeout.
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            if timeout 360 npx playwright install --with-deps chromium webkit; then exit 0; fi
            echo "Browser install attempt $attempt did not finish; retrying"
            sleep 15
          done
          exit 1
      - name: End-to-end tests (builds the app, starts it with an in-memory database)
        run: npx playwright test
      - name: Keep the failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
